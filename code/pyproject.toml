[project]
name = "icml26-conditional-conformal-test-martingales"
version = "0.1.0"
description = "Scoped ICML 2026 audit of conditional conformal test martingales"
requires-python = "==3.12.*"
dependencies = [
  "datasets==4.0.0",
  "huggingface-hub==0.34.3",
  "loguru==0.7.3",
  "marimo==0.14.17",
  "matplotlib==3.10.5",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "pillow==11.3.0",
  "pyarrow==21.0.0",
  "pytest==8.4.1",
  "scipy==1.16.1",
  "sympy==1.14.0",
  "timm==1.0.19",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["repro/tests"]
